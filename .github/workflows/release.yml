name: Build Qt edition

on:
  push:
    branches:
      - qt-modern
    tags:
      - "qt-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-qt.txt pyinstaller==6.16.0

      - name: Run tests
        run: python -m unittest -v

      - name: Build standalone application
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --exclude-module tkinter
          --name RimWorldTranslator-Qt
          rimworld_translator_qt.py

      - name: Smoke-test packaged GUI
        shell: pwsh
        run: |
          $process = Start-Process "dist/RimWorldTranslator-Qt.exe" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "Qt application exited during smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/RimWorldTranslator-Qt.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RimWorldTranslator-Qt.exe" | Set-Content "dist/RimWorldTranslator-Qt.exe.sha256" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: RimWorldTranslator-Qt-Windows
          path: |
            dist/RimWorldTranslator-Qt.exe
            dist/RimWorldTranslator-Qt.exe.sha256
          if-no-files-found: error

      - name: Upload files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          "dist/RimWorldTranslator-Qt.exe"
          "dist/RimWorldTranslator-Qt.exe.sha256"
          --clobber
